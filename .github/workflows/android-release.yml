name: Android APK

on:
  push:
    branches: [main, 'feat/native-backend-v2']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test mobile API contract and security
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest backend.test_api -v
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Validate Gradle project
        run: ./gradlew tasks
      - name: Test Android API serialization
        run: ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Identify this build
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cognitive-nexus-native-backend-v2.apk
          echo "Cognitive Nexus Mobile - Native backend v2" > build-info.txt
          echo "Commit: $GITHUB_SHA" >> build-info.txt
          echo "Install package: com.nmoreland.cognitivenexus.mobile" >> build-info.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-nexus-native-backend-v2-apk
          path: |
            cognitive-nexus-native-backend-v2.apk
            build-info.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signed GitHub Release skipped: signing secrets are missing. The debug APK artifact is still available."
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.available == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.available == 'true'
      - name: Build signed release APK and AAB
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "cognitive-nexus-v${version}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "cognitive-nexus-v${version}.aab"
      - name: Create GitHub Release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cognitive-nexus-v*.apk
            cognitive-nexus-v*.aab
